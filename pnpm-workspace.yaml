packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 blocks dependency install scripts unless listed here.
# Moved from apps/web (create-next-app wrote it there). false = don't run the script:
# sharp ships prebuilt binaries, and unrs-resolver is only used by ESLint plugins.
allowBuilds:
  sharp: false
  unrs-resolver: false
